<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des Écoles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="anonymous"/>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster.spiderfy@2.0.0/dist/MarkerCluster.SpiderfyOn.css" crossorigin="anonymous"/>
    <script src="https://unpkg.com/leaflet.markercluster.spiderfy@2.0.0/dist/leaflet.markercluster.spiderfy.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.css" crossorigin="anonymous"/>
    <script src="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; }
        #map { width: 100%; height: 95vh; }
        .status-banner {
            position: absolute;
            top: 12px;
            left: 50px;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 6px;
            color: #111;
            background: rgba(255, 255, 255, 0.92);
            font-family: Arial, sans-serif;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .status-banner.error {
            background: rgba(209, 36, 36, 0.92);
            color: #fff;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 50px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 6px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.8;
            color: #333;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .legend-circle {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        .school-count {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
            font-size: 12px;
        }
        .popup-content { font-family: Arial, sans-serif; font-size: 14px; color: #333; }
        .popup-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .rank-circle { display: inline-block; width: 24px; height: 24px; border-radius: 50%; color: white; font-size: 14px; text-align: center; line-height: 24px; }
        .spiderfy-info {
            position: absolute;
            top: 12px;
            right: 50px;
            z-index: 1000;
            padding: 6px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.85);
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
            display: none;
        }
    </style>
</head>
<body>
    <div id="status" class="status-banner">Chargement des écoles...</div>
    <div id="spiderfy-hint" class="spiderfy-info">💡 Cliquez sur un groupe pour séparer les écoles superposées</div>
    <div id="legend" class="legend" style="display: none;">
        <div class="legend-title">Classes de rang</div>
        <div class="legend-item">
            <div class="legend-circle" style="background-color: green;"></div>
            <span>Rang 1–99 (Vert)</span>
        </div>
        <div class="legend-item">
            <div class="legend-circle" style="background-color: orange;"></div>
            <span>Rang 100–220 (Orange)</span>
        </div>
        <div class="legend-item">
            <div class="legend-circle" style="background-color: red;"></div>
            <span>Rang 221+ (Rouge)</span>
        </div>
        <div class="school-count">Total écoles: <span id="school-count">0</span></div>
    </div>
    <div id="map"></div>
    <script>
        // Initialisation de la carte
        const map = L.map('map').setView([45.5, -73.6], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Configuration avancée du clustering avec Spiderfy
        const markerCluster = L.markerClusterGroup({
            disableClusteringAtZoom: 17,
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: true,
            zoomToBoundsOnClick: true,
            animateAddingMarkers: true,
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                const c = ' marker-cluster-';
                if (count < 10) {
                    return new L.Icon.Default();
                } else if (count < 100) {
                    return L.divIcon({
                        html: '<div style="background-color: #ff7800; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;">' + count + '</div>',
                        className: '',
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });
                } else {
                    return L.divIcon({
                        html: '<div style="background-color: #d50000; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;">' + count + '</div>',
                        className: '',
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });
                }
            }
        });

        const statusEl = document.getElementById('status');
        const spiderfyHint = document.getElementById('spiderfy-hint');

        function setStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.classList.toggle('error', !!isError);
        }

        function clearStatus() {
            statusEl.style.display = 'none';
        }

        function showLegend(totalCount) {
            document.getElementById('legend').style.display = 'block';
            document.getElementById('school-count').textContent = totalCount;
        }

        function showSpiderfyHint() {
            spiderfyHint.style.display = 'block';
            setTimeout(() => {
                spiderfyHint.style.display = 'none';
            }, 5000);
        }

        function normalizeText(value) {
            return String(value || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[‐‑‒–—−-]/g, '-')
                .trim();
        }

        function createPopupContent(nom, rang, adresse) {
            const container = document.createElement('div');
            container.className = 'popup-content';

            const title = document.createElement('div');
            title.className = 'popup-title';
            title.textContent = nom;

            const rankLine = document.createElement('div');
            const rankLabel = document.createElement('b');
            rankLabel.textContent = 'Rang: ';
            rankLine.appendChild(rankLabel);
            rankLine.appendChild(document.createTextNode(String(rang)));

            const addressLine = document.createElement('div');
            const addressLabel = document.createElement('b');
            addressLabel.textContent = 'Adresse: ';
            addressLine.appendChild(addressLabel);
            addressLine.appendChild(document.createTextNode(adresse));

            container.appendChild(title);
            container.appendChild(rankLine);
            container.appendChild(addressLine);
            return container;
        }

        // Fonction pour styliser les points selon le rang
        function getColor(rang) {
            return rang < 100 ? 'green' :
                   rang <= 220 ? 'orange' :
                   'red';
        }

        // Fonction pour créer un marqueur avec le rang au centre
        function createRankMarker(feature, latlng) {
            const rank = Number(feature.properties.rang);
            const rankColor = getColor(rank);
            const iconHtml = `<div class="rank-circle" style="background-color: ${rankColor};">${rank}</div>`;
            const icon = L.divIcon({
                html: iconHtml,
                className: '',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            return L.marker(latlng, { icon: icon });
        }

        // Charger les données GeoJSON depuis le fichier externe
        fetch('ecoles.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                const schoolsIndex = [];
                const searchResultsToLayer = {};
                const schoolsByName = {};

                const ecolesLayer = L.geoJSON(data, {
                    pointToLayer: createRankMarker,
                    onEachFeature: function (feature, layer) {
                        const nom = String(feature.properties.nom || 'École sans nom');
                        const rang = Number(feature.properties.rang);
                        const adresse = feature.properties.adresse || 'Adresse non disponible';
                        layer.bindPopup(createPopupContent(nom, rang, adresse));
                        
                        schoolsIndex.push({
                            nom: nom,
                            nomNormalized: normalizeText(nom),
                            rang: rang,
                            adresse: adresse,
                            latlng: layer.getLatLng(),
                            layer: layer
                        });

                        // Indexer par nom pour détecter les homonymes
                        if (!schoolsByName[nom]) {
                            schoolsByName[nom] = [];
                        }
                        schoolsByName[nom].push({
                            rang: rang,
                            adresse: adresse,
                            layer: layer,
                            latlng: layer.getLatLng()
                        });
                    }
                });

                markerCluster.addLayer(ecolesLayer);
                map.addLayer(markerCluster);

                const bounds = ecolesLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [24, 24] });
                }

                // Événement pour afficher hint spiderfy à la première utilisation
                let clusterClickedOnce = false;
                markerCluster.on('clusterclick', function() {
                    if (!clusterClickedOnce) {
                        clusterClickedOnce = true;
                        showSpiderfyHint();
                    }
                });

                // Ajouter un contrôle de recherche avec correspondance partielle
                const searchControl = new L.Control.Search({
                    marker: false,
                    textPlaceholder: 'Rechercher une école...',
                    initial: false,
                    sourceData: function(text, callResponse) {
                        const query = normalizeText(text);
                        const records = {};
                        Object.keys(searchResultsToLayer).forEach(key => delete searchResultsToLayer[key]);

                        if (!query) {
                            callResponse(records);
                            return;
                        }

                        for (const school of schoolsIndex) {
                            if (school.nomNormalized.includes(query)) {
                                const schoolGroup = schoolsByName[school.nom];
                                let displayKey;

                                // Point 8: Afficher plusieurs résultats homonymes explicitement
                                if (schoolGroup.length > 1) {
                                    // Pour les homonymes, afficher rang et première ligne d'adresse
                                    const addr = school.adresse.split(',')[0];
                                    displayKey = `${school.nom} - Rang ${school.rang} (${addr})`;
                                } else {
                                    // Pour les écoles uniques, format simplifié
                                    displayKey = `${school.nom} (Rang ${school.rang})`;
                                }

                                records[displayKey] = school.latlng;
                                searchResultsToLayer[displayKey] = school.layer;
                            }
                        }

                        callResponse(records);
                    },
                    moveToLocation: function(latlng, title, map) {
                        map.setView(latlng, 15);
                    }
                });

                map.addControl(searchControl);

                map.on('search:locationfound', function(event) {
                    const layer = searchResultsToLayer[event.text];
                    if (!layer) {
                        return;
                    }

                    // Point 9, 10: Utiliser spiderfyZoomToShowLayer pour séparer les points superposés
                    if (markerCluster.spiderfyZoomToShowLayer) {
                        markerCluster.spiderfyZoomToShowLayer(layer, function() {
                            layer.openPopup();
                        });
                    } else {
                        // Fallback si spiderfy n'est pas disponible
                        markerCluster.zoomToShowLayer(layer, function() {
                            layer.openPopup();
                        });
                    }
                });

                showLegend(schoolsIndex.length);
                clearStatus();
            })
            .catch(error => {
                console.error('Erreur de chargement du fichier GeoJSON :', error);
                setStatus('Impossible de charger les données des écoles. Vérifie le fichier ecoles.geojson.', true);
            });
    </script>
</body>
</html>
